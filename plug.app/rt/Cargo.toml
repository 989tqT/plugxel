[package]
name = "tm_main"
version = "1.0.0"
edition = "2021"

[lib]
name = "tm_main"
crate-type = ["staticlib", "rlib"]
path = "handlers/lib.rs"

[dependencies]
ureq = { version = "2.9", default-features = false, features = ["tls", "native-certs", "json"] }
wasmer = { version = "4.3.0", default-features = false, features = ["cranelift"] }
wasmer-compiler-cranelift = "4.3.0"
once_cell = "1.19.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10.8"
rand = "0.9"
hex = "0.4"
minisign-verify = "0.2"
url = "2.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "winnt", "processthreadsapi", "debugapi"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Fat Link Time Optimization (Maximum)
codegen-units = 1   # Better optimization, slower build
panic = "abort"     # Reduce size by removing stack unwinding
strip = true # Remove all symbols and debug info