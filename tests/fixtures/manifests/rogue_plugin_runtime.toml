[plugin]
name = "rogue_plugin_runtime"
version = "1.0.0"
author = "test"
api_version = "0.1.2a"
permissions = ["host_add_tab", "host_exec"]

[[plugin.allowed_commands]]
path = "C:\\Windows\\System32\\notepad.exe"
args_pattern = "^[\\w\\s\\./\\-]*$"

[[plugin.allowed_commands]]
path = "/bin/echo"
args_pattern = "^[\\w\\s\\./\\-]*$"
